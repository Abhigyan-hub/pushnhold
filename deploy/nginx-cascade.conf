# CASCADE API — TLS reverse proxy (Ubuntu + Nginx)
# DNS: api.cascade.mozartdev.in  A  <EC2 Elastic IP>
# Frontend: https://cascade.mozartdev.in  (do not use www.mozartdev.in for Cascade)
# Install:
#   sudo apt-get install -y nginx
#   sudo cp nginx-cascade.conf /etc/nginx/sites-available/cascade-api
#   sudo ln -sf /etc/nginx/sites-available/cascade-api /etc/nginx/sites-enabled/cascade-api
#   sudo certbot --nginx -d api.cascade.mozartdev.in
# Node stays on 127.0.0.1:4000. Do not publish :4000 in public URLs.

server {
    listen 80;
    listen [::]:80;
    server_name api.cascade.mozartdev.in;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
    }
}
