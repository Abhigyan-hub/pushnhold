# CASCADE API — TLS reverse proxy
# api.cascade.mozartdev.in → 127.0.0.1:4000
# Copy to /etc/nginx/sites-available/cascade-api then:
#   sudo ln -sf /etc/nginx/sites-available/cascade-api /etc/nginx/sites-enabled/cascade-api
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name api.cascade.mozartdev.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.cascade.mozartdev.in;

    ssl_certificate /etc/letsencrypt/live/api.cascade.mozartdev.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.cascade.mozartdev.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
